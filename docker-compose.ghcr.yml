# Runs the published image, no build needed:
#   docker compose -f docker-compose.ghcr.yml up -d
# Open http://localhost:3080. Setup key: docker compose -f docker-compose.ghcr.yml exec dispatch cat /data/.setup-key
# For HTTPS, put your own TLS proxy in front of port 3080 and set DISPATCH_ORIGIN and DISPATCH_COOKIE_SECURE=true.
services:
  dispatch:
    image: ghcr.io/asmiia/dispatch:alpha
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:3080"
    environment:
      DISPATCH_SETUP_KEY: ${DISPATCH_SETUP_KEY:-}
      DISPATCH_ORIGIN: ${DISPATCH_ORIGIN:-}
      DISPATCH_COOKIE_SECURE: ${DISPATCH_COOKIE_SECURE:-}
      DISPATCH_TRUST_PROXY: ${DISPATCH_TRUST_PROXY:-}
      DISPATCH_LOG_LEVEL: ${DISPATCH_LOG_LEVEL:-info}
      DISPATCH_BACKUP_INTERVAL_HOURS: ${DISPATCH_BACKUP_INTERVAL_HOURS:-24}
      DISPATCH_BACKUP_KEEP: ${DISPATCH_BACKUP_KEEP:-14}
      DISPATCH_BACKUP_PASSPHRASE: ${DISPATCH_BACKUP_PASSPHRASE:-}
      DISPATCH_SMTP_URL: ${DISPATCH_SMTP_URL:-}
      DISPATCH_MAIL_FROM: ${DISPATCH_MAIL_FROM:-}
      DISPATCH_GITHUB_CLIENT_ID: ${DISPATCH_GITHUB_CLIENT_ID:-}
      DISPATCH_GITHUB_CLIENT_SECRET: ${DISPATCH_GITHUB_CLIENT_SECRET:-}
      DISPATCH_GOOGLE_CLIENT_ID: ${DISPATCH_GOOGLE_CLIENT_ID:-}
      DISPATCH_GOOGLE_CLIENT_SECRET: ${DISPATCH_GOOGLE_CLIENT_SECRET:-}
    volumes:
      - dispatch-data:/data
      - dispatch-backups:/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  dispatch-data:
  dispatch-backups:
