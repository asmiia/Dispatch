name: Feature request
description: Suggest something Dispatch should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation first, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web app
        - MCP / agents
        - Accounts and security
        - Backups and operations
        - Docker and deployment
        - Docs
        - Other
  - type: checkboxes
    id: help
    attributes:
      label: Would you like to build it?
      options:
        - label: I'm willing to open a pull request for this.
